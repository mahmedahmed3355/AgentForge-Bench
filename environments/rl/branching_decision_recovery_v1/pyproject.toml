[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "branching-decision-recovery-v1"
version = "0.1.0"
description = "AgentForge-Bench Branching Decision & Recovery V1 environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1,<0.4",
    "gymnasium>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
exclude = ["**/*.bak"]
packages = ["branching_decision_recovery_v1"]

[tool.hatch.build.targets.wheel.force-include]
"data/scenarios.json" = "branching_decision_recovery_v1/data/scenarios.json"

[tool.verifiers.eval]
num_examples = 3
rollouts_per_example = 1
