[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline-recovery-v1"
version = "0.1.2"
description = "AgentForge-Bench Long-Horizon Data Pipeline Recovery V1 environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1,<0.4",
    "gymnasium>=1.0,<2",
]


[tool.hatch.build.targets.wheel]
packages = ["data_pipeline_recovery_v1"]

[tool.hatch.build.targets.wheel.force-include]
"data/scenarios.json" = "data_pipeline_recovery_v1/data/scenarios.json"

[tool.verifiers.eval]
num_examples = 3
rollouts_per_example = 1
