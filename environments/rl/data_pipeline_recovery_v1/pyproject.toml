[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline-recovery-v1"
version = "0.1.1"
description = "AgentForge-Bench Long-Horizon Data Pipeline Recovery V1 environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
"verifiers>=0.3.1,<0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline_recovery_v1"]

[tool.verifiers.eval]
num_examples = 3
rollouts_per_example = 1
